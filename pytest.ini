[pytest]
filterwarnings =
    ignore:.*disp.*iprint.*deprecated.*:DeprecationWarning:sklearn.linear_model._logistic
    ignore::sklearn.exceptions.ConvergenceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    # The NRT QC tests exercise the deprecated aiqclib copy on purpose
    # (removed in 0.15.0); test_nrtqc_deprecation.py checks the warnings.
    ignore:.*is moving to the nrtqclib package:DeprecationWarning
